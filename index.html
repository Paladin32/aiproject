<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>My AI — by Paul</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #121214;
      --surface2: #1c1c1f;
      --border: #2a2a2e;
      --text: #f4f4f5;
      --muted: #71717a;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .brand span {
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 500;
    }
    #status {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
    }
    .status-ready { color: var(--success) !important; }
    .status-error { color: var(--danger) !important; }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, .btn, input[type="text"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 9px;
      padding: 7px 11px;
      font-size: 0.8rem;
      outline: none;
    }
    select { flex: 1; min-width: 120px; }
    .btn {
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .btn:hover { background: #27272a; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-danger { color: var(--danger); border-color: #3f1f1f; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    /* Settings panel */
    #settingsPanel {
      display: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 4px;
      flex-direction: column;
      gap: 10px;
    }
    #settingsPanel.open { display: flex; }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field label {
      font-size: 0.72rem;
      color: var(--muted);
    }
    .field input, .field textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }
    .field textarea {
      min-height: 70px;
      resize: vertical;
      font-family: inherit;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--muted);
      max-width: 300px;
      padding: 20px;
    }
    .empty-state h2 {
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 8px;
      font-weight: 600;
    }
    .empty-state p {
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .msg {
      max-width: 88%;
      padding: 11px 14px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
      font-size: 0.95rem;
    }
    .user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 5px;
    }
    .assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }
    .system {
      align-self: center;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
      max-width: 92%;
      background: transparent;
      border: none;
      padding: 4px 10px;
    }
    .msg-actions {
      position: absolute;
      top: 7px;
      right: 9px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .assistant:hover .msg-actions,
    .assistant:active .msg-actions { opacity: 1; }
    .copy-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 5px;
      cursor: pointer;
    }

    footer {
      padding: 12px 14px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      resize: none;
      min-height: 46px;
      max-height: 130px;
      line-height: 1.4;
    }
    #input:focus { border-color: var(--accent); }
    #send {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      height: 46px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      flex-shrink: 0;
    }
    #send:hover { background: var(--accent-hover); }
    #send:disabled { opacity: 0.4; cursor: not-allowed; }

    .footer-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      color: var(--muted);
      padding: 0 2px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <div class="brand">
        <h1>My AI</h1>
        <span>Made by Paul</span>
      </div>
      <div id="status">Not connected</div>
    </div>

    <div class="controls">
      <select id="modelSelect" disabled>
        <option value="">No model</option>
      </select>
      <button class="btn" id="settingsBtn">Settings</button>
      <button class="btn btn-danger" id="clearBtn">Clear</button>
    </div>

    <div id="settingsPanel">
      <div class="field">
        <label>Ollama URL (example: http://123.45.67.89:11434)</label>
        <input type="text" id="baseUrl" placeholder="http://IP:11434" />
      </div>
      <div class="field">
        <label>System Prompt (controls personality & restrictions)</label>
        <textarea id="systemPrompt" placeholder="You are a helpful assistant..."></textarea>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" id="saveSettings">Save & Connect</button>
        <button class="btn" id="closeSettings">Close</button>
      </div>
    </div>
  </header>

  <div id="chat">
    <div class="empty-state" id="emptyState">
      <h2>Your private AI</h2>
      <p>Open Settings, paste the VPS address,<br>then start chatting.</p>
    </div>
  </div>

  <footer>
    <div class="input-row">
      <textarea id="input" placeholder="Message…" rows="1" disabled></textarea>
      <button id="send" disabled>Send</button>
    </div>
    <div class="footer-meta">
      <span id="connectionInfo">Not connected</span>
      <span>Made by Paul</span>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
