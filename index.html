<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#020205">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Arqen Era</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#020205;--ink:#f4f4f8;--mute:#80829a;--line:rgba(255,255,255,.08);--glass:rgba(4,4,8,.82);--h:rgba(255,255,255,.08);--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;inset:0}
body{font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;background:radial-gradient(80% 60% at 30% 100%,#ff5e7e22,transparent),radial-gradient(70% 60% at 90% 90%,#2b59ff33,transparent),var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
.app{display:flex;height:100%;width:100%;padding-left:var(--safe-l);padding-right:var(--safe-r)}
.side{width:260px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;padding:calc(12px + var(--safe-t)) 12px calc(12px + var(--safe-b));background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--line);overflow:hidden}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:-.03em;padding:6px;flex-shrink:0}
.brand i{width:10px;height:10px;border-radius:50%;background:conic-gradient(#ffb347,#ff5e7e,#4d7bff,#ffb347);box-shadow:0 0 14px #ff5e7e99}
.new{height:40px;border-radius:11px;background:#fff;color:#0a0b12;font-weight:600;width:100%;flex-shrink:0;padding:0 14px}
.nav{flex-shrink:0}
.nav button,.recent button{display:block;width:100%;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button.on,.nav button:active,.recent button:active{background:var(--h);color:var(--ink)}
.recent{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.grp{font-size:11px;color:var(--mute);padding:8px 12px 4px;opacity:.7}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden}
.top{flex-shrink:0;height:calc(50px + var(--safe-t));padding-top:var(--safe-t);padding-left:12px;padding-right:12px;display:flex;align-items:center;gap:8px;font-weight:600}
.burger{display:none;width:40px;height:40px;place-items:center;border-radius:10px;color:var(--mute)}
#view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
h1{font-size:clamp(34px,9vw,80px);font-weight:600;letter-spacing:-.05em;line-height:.95;text-align:center}
h1 .dim{color:rgba(255,255,255,.42)}
.box{width:min(700px,100%);border-radius:18px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px;box-shadow:inset 0 0 0 1px var(--line)}
textarea,input{font:inherit;color:var(--ink);font-size:16px}
textarea{width:100%;border:0;background:none;resize:none;outline:0;min-height:44px;max-height:140px;line-height:1.45}
textarea::placeholder,input::placeholder{color:#80829a}
.row{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:9px;color:var(--mute);font-weight:600;font-size:13px}
.chip.on{background:var(--h);color:var(--ink)}
.send{width:36px;height:36px;border-radius:50%;background:#fff;color:#0a0b12;display:grid;place-items:center;margin-left:auto;opacity:.35}
.send.ready{opacity:1}
.chat{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:8px 14px 10px}
.mi{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.u{align-self:flex-end;max-width:min(88%,500px);background:rgba(255,255,255,.09);padding:10px 14px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;line-height:1.5;word-break:break-word}
.a{line-height:1.6;color:#dcdce6;word-break:break-word}
.a p{margin:0 0 .55em}.a p:last-child{margin:0}
.a code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px}
.think{color:var(--mute)}
.cb{margin:10px 0;border-radius:12px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;color:var(--mute);font-size:12px;border-bottom:1px solid var(--line);gap:8px}
.ch button{padding:4px 9px;border-radius:7px;color:var(--ink);font-weight:600}
.cb pre{padding:12px;overflow:auto;max-height:min(36vh,280px);-webkit-overflow-scrolling:touch}
.cb pre code{background:none;padding:0;color:#c9cadb;font-size:12.5px;line-height:1.5;white-space:pre}
.cin{flex-shrink:0;padding:0 14px calc(10px + var(--safe-b));display:flex;justify-content:center}
.pg{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(32px + var(--safe-b));max-width:860px;width:100%;margin:0 auto}
.pg h2{font-size:24px;font-weight:600;margin-bottom:6px}
.pg .sub{color:var(--mute);font-size:13px;margin-bottom:16px;line-height:1.45}
.in{width:100%;height:44px;padding:0 12px;border-radius:11px;border:0;background:rgba(255,255,255,.05);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:10px}
.ta{width:100%;min-height:120px;padding:12px;border-radius:11px;border:0;background:rgba(255,255,255,.05);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);resize:vertical;line-height:1.45;margin-bottom:10px}
.sc{padding:14px;border-radius:14px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:12px}
.sc h3{font-size:13px;margin-bottom:8px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;background:rgba(255,255,255,.08);font-weight:600}
.btn.p{background:#fff;color:#0a0b12}
.btn.d{color:#ff8a9a}
.fine{color:var(--mute);font-size:12px;text-align:center}
.scrim{display:none}
.lock{max-width:360px;margin:40px auto;padding:20px}
.lock p{color:var(--mute);margin-bottom:12px;line-height:1.5}
.feed-item{padding:12px 0;border-bottom:1px solid var(--line)}
.feed-item .t{font-weight:600;margin-bottom:4px}
.feed-item .m{color:var(--mute);font-size:12px;margin-bottom:8px}
.feed-item .x{color:var(--mute);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.feed-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--mute);font-size:13px}
.toggle input{width:18px;height:18px}
.acct{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#ff5e7e,#4d7bff);display:grid;place-items:center;font-weight:700;font-size:20px;overflow:hidden;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.acct .nm{font-weight:600;font-size:18px}
.acct .em{color:var(--mute);font-size:13px;margin-top:2px}
.conn{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.conn .l{display:flex;align-items:center;gap:12px}
.conn .ic{width:36px;height:36px;border-radius:9px;background:#fff;display:grid;place-items:center;flex-shrink:0}
.conn .ic svg{width:18px;height:18px}
.conn .st{font-size:12px;color:var(--mute)}
.conn .st.on{color:#7dffa6}
#modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);padding:max(2vh,var(--safe-t)) max(2vw,var(--safe-r)) max(2vh,var(--safe-b)) max(2vw,var(--safe-l))}
#modal.on{display:flex}
.mp{flex:1;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:#0b0b10;box-shadow:inset 0 0 0 1px #2a2a31;min-height:0}
.mh{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
.mh input{flex:1;min-width:100px;height:36px;padding:0 10px;border-radius:8px;border:0;background:rgba(255,255,255,.06);color:var(--ink);font-size:16px}
#mf{flex:1;border:0;background:#fff;min-height:0}
@media(max-width:860px){
.side{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-105%);transition:transform .25s ease;width:min(300px,88vw);padding-bottom:calc(12px + var(--safe-b))}
.app.open .side{transform:none}
.app.open .scrim{display:block;position:fixed;inset:0;z-index:20;background:#0009}
.burger{display:grid}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><i></i>Arqen Era</div>
    <button type="button" class="new" id="newChat">New chat</button>
    <nav class="nav">
      <button type="button" data-go="home" class="on">Home</button>
      <button type="button" data-go="chats">Chats</button>
      <button type="button" data-go="feed">Data Feed</button>
      <button type="button" data-go="account">Account</button>
      <button type="button" data-go="settings">Settings</button>
      <button type="button" data-go="admin">Admin</button>
    </nav>
    <div class="recent" id="rec"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="top">
      <button type="button" class="burger" id="burger" aria-label="Menu">☰</button>
      <span id="ttl">New chat</span>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="modal"><div class="mp"><div class="mh"><input id="mName" placeholder="Project name"><button type="button" class="btn p" id="mSave">Save</button><button type="button" class="btn" id="mDl">Download</button><button type="button" class="btn" id="mX">Close</button></div><iframe id="mf" title="Preview" sandbox="allow-scripts allow-forms allow-modals"></iframe></div></div>
<script>
(function(){
const $=s=>document.querySelector(s);
const DEFAULT_API='https://lightning-console-sierra-audience.trycloudflare.com/v1';
const DEFAULT_ADMIN_PASS='arqen2026';
const FEED_MAX_CHARS=12000;
function cfg(){try{return JSON.parse(localStorage.getItem('arqen-cfg')||'{}')}catch(e){return {}}}
function saveCfg(c){localStorage.setItem('arqen-cfg',JSON.stringify(c))}
let C=Object.assign({apiBase:localStorage.getItem('arqen-api-base')||DEFAULT_API,apiKey:'ollama',model:'arqen',adminPass:DEFAULT_ADMIN_PASS,style:'',feedOn:true,googleClientId:''},cfg());
C.apiBase=(C.apiBase||DEFAULT_API).replace(/\/$/,'');
function ldAcc(){try{return JSON.parse(localStorage.getItem('arqen-account')||'{}')}catch(e){return {}}}
function svAcc(a){localStorage.setItem('arqen-account',JSON.stringify(a))}
let ACC=Object.assign({name:'',email:'',picture:'',google:false,displayName:''},ldAcc());
function ldFeed(){try{const d=JSON.parse(localStorage.getItem('arqen-feed')||'[]');return Array.isArray(d)?d:[]}catch(e){return []}}
function svFeed(f){localStorage.setItem('arqen-feed',JSON.stringify(f))}
let FEED=ldFeed();
function ld(){try{const d=JSON.parse(localStorage.getItem('arqen-era-v2'));if(d&&d.chats)return d}catch(e){}return{chats:[],cur:null,use:'ask'}}
let S=ld(); if(!S.use)S.use='ask';
const sv=()=>{try{localStorage.setItem('arqen-era-v2',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let busy=false,ctl=null,codes=[],previewHtml='',adminOK=sessionStorage.getItem('arqen-admin')==='1';
let streamTarget=null, gisLoaded=false;
function cur(){return S.chats.find(c=>c.id===S.cur)}
function displayName(){return ACC.displayName||ACC.name||'Guest'}
function initials(){const n=displayName();return (n.trim().slice(0,1)||'?').toUpperCase()}
function feedContext(){
  if(C.feedOn===false) return '';
  const active=FEED.filter(x=>x.on!==false);
  if(!active.length) return '';
  let out='\n\n[Knowledge base — use when relevant]\n';
  let used=0;
  for(const d of active){
    const block='### '+d.title+'\n'+d.body.trim()+'\n\n';
    if(used+block.length>FEED_MAX_CHARS) break;
    out+=block; used+=block.length;
  }
  return out;
}
function SYS(){
  const extra=C.style?(' '+C.style):'';
  const who=ACC.google||ACC.displayName?(' The user is named '+displayName()+'.'):'';
  const kb=feedContext();
  if(S.use==='build') return 'You are Arqen Era. Build mode: when the user wants an app or UI, reply with one short sentence then one complete self-contained HTML file (inline CSS/JS, no external libs) in a single html code block. Polished and responsive.'+who+extra+kb;
  if(S.use==='plan') return 'You are Arqen Era. Plan mode: outline steps only, no full code.'+who+extra+kb;
  return 'You are Arqen Era. Chat normally. Answer questions and talk naturally. Do NOT generate full HTML apps unless the user clearly asks to build or code something.'+who+extra+kb;
}
function md(t){
  codes=[]; let o='';
  t.split('```').forEach((s,i)=>{
    if(i%2===0){ if(s.trim()) o+='<p>'+esc(s.trim()).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>')+'</p>'; }
    else {
      const m=s.match(/^([\w+-]*)\n?([\s\S]*)$/), l=m[1]||'code', body=m[2];
      codes.push(body); const n=codes.length-1;
      o+='<div class="cb"><div class="ch"><span>'+esc(l)+'</span><span><button type="button" data-copy="'+n+'">Copy</button>'+(/^html?$/i.test(l)?'<button type="button" data-prev="'+n+'">Preview</button>':'')+'</span></div><pre><code>'+esc(body)+'</code></pre></div>';
    }
  });
  return o||('<p>'+esc(t)+'</p>');
}
function side(){
  const a=S.chats.slice(0,16);
  $('#rec').innerHTML=a.length?'<div class="grp">Recent</div>'+a.map(c=>`<button type="button" data-open="${c.id}">${esc(c.title)}</button>`).join(''):'';
}
function modeChips(){
  return ['ask','plan','build'].map(m=>`<button type="button" class="chip${S.use===m?' on':''}" data-use="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('');
}
function closeSide(){$('#app').classList.remove('open')}
function home(){
  streamTarget=null;
  $('#ttl').textContent='New chat';
  $('#view').innerHTML=`<div class="home"><h1>Describe it.<br><span class="dim">Watch it ship.</span></h1>
  <div class="box"><textarea id="p" rows="2" placeholder="Say hi, ask a question, or describe an app…" enterkeyhint="send"></textarea>
  <div class="row">${modeChips()}<button type="button" class="send" id="send" aria-label="Send">↑</button></div></div>
  <p class="fine">Ask · Plan · Build</p></div>`;
  wire();
}
function buildChatShell(c){
  $('#ttl').textContent=c.title||'Chat';
  $('#view').innerHTML=`<div class="chat"><div class="msgs" id="ms"><div class="mi" id="mi"></div></div>
  <div class="cin"><div class="box"><textarea id="p" rows="2" placeholder="Reply…" enterkeyhint="send"></textarea>
  <div class="row">${modeChips()}<button type="button" class="send" id="send" aria-label="Send">↑</button></div></div></div></div>`;
  wire();
}
function renderMsgs(scrollBottom){
  const c=cur(); if(!c) return;
  const mi=$('#mi'); if(!mi) return;
  const ms=$('#ms');
  const stick=scrollBottom || (ms && (ms.scrollHeight-ms.scrollTop-ms.clientHeight<80));
  mi.innerHTML=c.msgs.map((m,i)=>{
    if(m.role==='user') return `<div class="u">${esc(m.content)}</div>`;
    return `<div class="a" data-ai="${i}">${m.content?md(m.content):'<span class="think">Thinking…</span>'}</div>`;
  }).join('');
  streamTarget=mi.querySelector('.a[data-ai]:last-of-type');
  if(ms&&stick) ms.scrollTop=ms.scrollHeight;
}
function chatsView(){
  streamTarget=null;
  $('#ttl').textContent='Chats';
  $('#view').innerHTML=`<div class="pg"><h2>Chats</h2>${S.chats.length?S.chats.map(c=>`<div style="display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0">
    <button type="button" style="flex:1;font-weight:600" data-open="${c.id}">${esc(c.title)}</button>
    <button type="button" class="btn" data-del="${c.id}">×</button></div>`).join(''):'<p class="fine">No chats yet.</p>'}</div>`;
}
function feedView(){
  streamTarget=null;
  $('#ttl').textContent='Data Feed';
  const list=FEED.length?FEED.map((d,i)=>`<div class="feed-item">
    <div class="t">${esc(d.title)}</div>
    <div class="m">${d.on===false?'Off · ':''}${(d.body||'').length} chars</div>
    <div class="x">${esc((d.body||'').slice(0,220))}</div>
    <div class="feed-actions">
      <button type="button" class="btn" data-feed-edit="${i}">Edit</button>
      <button type="button" class="btn" data-feed-toggle="${i}">${d.on===false?'Enable':'Disable'}</button>
      <button type="button" class="btn d" data-feed-del="${i}">Delete</button>
    </div></div>`).join(''):'<p class="fine" style="text-align:left;margin:12px 0">No documents yet.</p>';
  $('#view').innerHTML=`<div class="pg"><h2>Data Feed</h2>
    <p class="sub">Knowledge injected into Arqen (up to ~12k chars).</p>
    <label class="toggle"><input type="checkbox" id="feedOn" ${C.feedOn!==false?'checked':''}> Use knowledge base in chat</label>
    <div class="sc"><h3>Add document</h3>
      <input class="in" id="fTitle" placeholder="Title">
      <textarea class="ta" id="fBody" placeholder="Paste text…"></textarea>
      <button type="button" class="btn p" id="fAdd">Add to feed</button>
    </div>
    <div class="sc"><h3>Library (${FEED.length})</h3>${list}</div></div>`;
  $('#feedOn').onchange=()=>{C.feedOn=$('#feedOn').checked;saveCfg(C)};
  $('#fAdd').onclick=()=>{
    const title=($('#fTitle').value||'').trim()||'Untitled';
    const body=($('#fBody').value||'').trim();
    if(!body){alert('Empty');return}
    FEED.unshift({id:uid(),title,body,on:true,t:Date.now()});
    svFeed(FEED); feedView();
  };
}
function feedEditView(i){
  const d=FEED[i]; if(!d) return feedView();
  $('#ttl').textContent='Edit document';
  $('#view').innerHTML=`<div class="pg"><h2>Edit</h2>
    <input class="in" id="fTitle"><textarea class="ta" id="fBody" style="min-height:220px"></textarea>
    <button type="button" class="btn p" id="fSave">Save</button>
    <button type="button" class="btn" id="fCancel" style="margin-left:8px">Cancel</button></div>`;
  $('#fTitle').value=d.title; $('#fBody').value=d.body;
  $('#fSave').onclick=()=>{d.title=($('#fTitle').value||'').trim()||'Untitled';d.body=($('#fBody').value||'').trim();d.t=Date.now();svFeed(FEED);feedView()};
  $('#fCancel').onclick=()=>feedView();
}
function parseJwt(token){
  try{
    const base=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(atob(base).split('').map(c=>'%'+(('00'+c.charCodeAt(0).toString(16)).slice(-2))).join('')));
  }catch(e){return null}
}
function loadGis(cb){
  if(window.google&&window.google.accounts){cb();return}
  if(gisLoaded){const t=setInterval(()=>{if(window.google&&window.google.accounts){clearInterval(t);cb()}},100);return}
  gisLoaded=true;
  const s=document.createElement('script');
  s.src='https://accounts.google.com/gsi/client';
  s.async=true; s.onload=()=>cb();
  s.onerror=()=>alert('Could not load Google Sign-In script');
  document.head.appendChild(s);
}
function onGoogleCredential(resp){
  const p=parseJwt(resp.credential);
  if(!p){alert('Google login failed');return}
  ACC.google=true;
  ACC.name=p.name||'';
  ACC.email=p.email||'';
  ACC.picture=p.picture||'';
  if(!ACC.displayName) ACC.displayName=p.name||'';
  svAcc(ACC);
  accountView();
}
function connectGoogle(){
  const cid=(C.googleClientId||'').trim();
  if(!cid){
    alert('Set Google Client ID in Admin first.\n\nGoogle Cloud → APIs & Services → Credentials → OAuth 2.0 Client ID (Web).\nAuthorized JavaScript origin:\nhttps://paladin32.github.io');
    return;
  }
  loadGis(()=>{
    try{
      google.accounts.id.initialize({client_id:cid,callback:onGoogleCredential,auto_select:false});
      google.accounts.id.prompt((n)=>{
        if(n&&(n.isNotDisplayed()||n.isSkippedMoment()||n.isDismissedMoment())){
          const host=document.createElement('div');
          host.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.65);display:grid;place-items:center';
          host.innerHTML='<div id="gsiBtn" style="background:#111;padding:20px;border-radius:12px"></div><button type="button" id="gsiX" style="margin-top:12px;color:#fff">Close</button>';
          document.body.appendChild(host);
          google.accounts.id.renderButton(host.querySelector('#gsiBtn'),{theme:'outline',size:'large',width:280});
          host.querySelector('#gsiX').onclick=()=>host.remove();
        }
      });
    }catch(e){alert('Google Sign-In error: '+(e.message||e))}
  });
}

function wire(){
  const p=$('#p'), s=$('#send'); if(!p) return;
  const sync=()=>{p.style.height='auto';p.style.height=Math.min(p.scrollHeight,140)+'px';s.classList.toggle('ready',!!p.value.trim()||busy)};
  p.oninput=sync; sync();
  const go=()=>{const v=p.value.trim(); if(!v||busy)return; p.value='';sync(); ask(v)};
  p.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}};
  s.onclick=()=>{if(busy&&ctl){ctl.abort();return} go()};
}
function scrollMsgs(){const ms=$('#ms'); if(ms) ms.scrollTop=ms.scrollHeight}
async function ask(t){
  let c=cur();
  if(!c){c={id:uid(),title:t.slice(0,48),msgs:[],t:Date.now()};S.chats.unshift(c);S.cur=c.id}
  c.msgs.push({role:'user',content:t}); c.t=Date.now(); sv();
  const m={role:'assistant',content:''}; c.msgs.push(m);
  busy=true; ctl=new AbortController();
  if(!$('#mi')) buildChatShell(c);
  renderMsgs(true); side();
  const messages=[{role:'system',content:SYS()},...c.msgs.slice(0,-1).map(x=>({role:x.role,content:x.content}))];
  const headers={'Content-Type':'application/json','Authorization':'Bearer '+C.apiKey};
  try{
    try{
      const res=await fetch(C.apiBase+'/chat/completions',{
        method:'POST', headers, body:JSON.stringify({model:C.model,messages,stream:true}), signal:ctl.signal
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      if(!res.body||!res.body.getReader) throw new Error('no-stream');
      const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
      let last=0;
      while(true){
        const {done,value}=await reader.read();
        if(done) break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n'); buf=lines.pop()||'';
        let ch=false;
        for(const line of lines){
          const row=line.trim(); if(!row.startsWith('data:')) continue;
          const payload=row.slice(5).trim(); if(payload==='[DONE]') continue;
          try{const j=JSON.parse(payload); const d=j.choices?.[0]?.delta?.content||''; if(d){m.content+=d; ch=true}}catch(e){}
        }
        if(ch){
          const now=performance.now();
          if(now-last>50){
            last=now;
            if(streamTarget){ streamTarget.innerHTML=m.content?md(m.content):'<span class="think">Thinking…</span>'; scrollMsgs(); }
            else renderMsgs(true);
          }
        }
      }
    }catch(streamErr){
      if(streamErr.name==='AbortError') throw streamErr;
      const res=await fetch(C.apiBase+'/chat/completions',{
        method:'POST', headers, body:JSON.stringify({model:C.model,messages,stream:false}), signal:ctl.signal
      });
      if(!res.ok){const body=await res.text().catch(()=>''); throw new Error('HTTP '+res.status+(body?': '+body.slice(0,120):''));}
      const j=await res.json();
      m.content=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
    }
    m.content=(m.content||'').replace(/<think>[\s\S]*?<\/think>/gi,'').trim();
  }catch(e){
    if(e.name!=='AbortError'){
      m.content='Could not reach the model.\n\n'+(e.message||'Network error')+'\n\nCheck Admin → Backend API URL.';
    }
  }
  busy=false; sv();
  if(streamTarget) streamTarget.innerHTML=m.content?md(m.content):'';
  else renderMsgs(true);
  scrollMsgs(); side();
}
document.addEventListener('click',e=>{
  const use=e.target.closest('[data-use]');
  if(use){S.use=use.dataset.use;sv(); document.querySelectorAll('[data-use]').forEach(b=>b.classList.toggle('on',b.dataset.use===S.use)); return}
  const cp=e.target.closest('[data-copy]');
  if(cp){navigator.clipboard.writeText(codes[+cp.dataset.copy]||''); cp.textContent='Copied'; setTimeout(()=>cp.textContent='Copy',1000); return}
  const pv=e.target.closest('[data-prev]');
  if(pv){previewHtml=codes[+pv.dataset.prev]||''; $('#modal').classList.add('on'); $('#mf').srcdoc=previewHtml; $('#mName').value=''; return}
  const fe=e.target.closest('[data-feed-edit]');
  if(fe){feedEditView(+fe.dataset.feedEdit);return}
  const ft=e.target.closest('[data-feed-toggle]');
  if(ft){const i=+ft.dataset.feedToggle; FEED[i].on=FEED[i].on===false?true:false; svFeed(FEED); feedView(); return}
  const fd=e.target.closest('[data-feed-del]');
  if(fd){if(confirm('Delete?')){FEED.splice(+fd.dataset.feedDel,1); svFeed(FEED); feedView()} return}
  const b=e.target.closest('[data-go],[data-open],[data-del],#newChat,#burger,#scrim,#mX,#mDl');
  if(!b) return;
  if(b.id==='newChat'){S.cur=null;sv();home();side();closeSide()}
  if(b.id==='burger') $('#app').classList.add('open');
  if(b.id==='scrim') closeSide();
  if(b.id==='mX'){$('#modal').classList.remove('on');$('#mf').srcdoc=''}
  if(b.id==='mDl'&&previewHtml){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([previewHtml],{type:'text/html'}));a.download=($('#mName').value||'project')+'.html';a.click()}
  if(b.dataset.go==='home'){S.cur=null;home();side();closeSide()}
  if(b.dataset.go==='chats'){chatsView();closeSide()}
  if(b.dataset.go==='feed'){feedView();closeSide()}
  if(b.dataset.go==='account'){accountView();closeSide()}
  if(b.dataset.go==='settings'){settingsView();closeSide()}
  if(b.dataset.go==='admin'){adminView();closeSide()}
  if(b.dataset.open){S.cur=b.dataset.open;sv();buildChatShell(cur());renderMsgs(true);side();closeSide()}
  if(b.dataset.del){S.chats=S.chats.filter(c=>c.id!==b.dataset.del); if(S.cur===b.dataset.del)S.cur=null;sv();chatsView();side()}
});
home(); side();
})();
</script>
