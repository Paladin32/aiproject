<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020205"><title>Arqen Era</title></head>
<body style="margin:0;background:#020205;color:#9a9ab0;font-family:system-ui;display:grid;place-items:center;height:100dvh"><div id="s">Loading…</div>
<script>(async()=>{try{const n=5;const parts=await Promise.all(Array.from({length:n},(_,i)=>fetch('p'+i+'.txt?v=4').then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.getElementById('s').textContent='Error: '+e.message}})()</script></body></html>
