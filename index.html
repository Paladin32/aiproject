<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#020205">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Arqen Era</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#020205;--ink:#f4f4f8;--mute:#80829a;
  --line:rgba(255,255,255,.08);--glass:rgba(4,4,8,.78);--h:rgba(255,255,255,.07);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;overscroll-behavior:none}
body{
  font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(80% 60% at 30% 100%,#ff5e7e22,transparent),
    radial-gradient(70% 60% at 90% 90%,#2b59ff33,transparent),
    var(--bg);
  color:var(--ink);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button,a,.chip,.send,.new{touch-action:manipulation}
.app{
  display:grid;grid-template-columns:256px 1fr;
  height:100%;height:100dvh;
  padding-left:var(--safe-l);padding-right:var(--safe-r);
}
.side{
  display:flex;flex-direction:column;gap:12px;
  padding:calc(14px + var(--safe-t)) 12px 14px;
  background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-right:1px solid var(--line);min-height:0;overflow:hidden;
}
.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;letter-spacing:-.03em;padding:4px 6px;flex-shrink:0}
.brand i{width:11px;height:11px;border-radius:50%;background:conic-gradient(#ffb347,#ff5e7e,#4d7bff,#ffb347);box-shadow:0 0 16px #ff5e7e99;flex-shrink:0}
.new{height:40px;padding:0 14px;border-radius:11px;background:#fff;color:#0a0b12;font-weight:600;width:100%;flex-shrink:0}
.nav{flex-shrink:0}
.nav button,.recent button{
  display:block;width:100%;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.nav button:hover,.recent button:hover,.nav button.on,.recent button.on{background:var(--h);color:var(--ink)}
.recent{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.grp{font-size:12px;color:var(--mute);padding:8px 12px 4px;opacity:.75;position:sticky;top:0;background:rgba(4,4,8,.9);backdrop-filter:blur(8px)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;min-height:0;overflow:hidden}
.top{
  height:calc(52px + var(--safe-t));padding:var(--safe-t) 16px 0;
  display:flex;align-items:center;font-weight:600;gap:8px;flex-shrink:0;
}
#view{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.home{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;padding:16px 16px calc(16px + var(--safe-b));
}
h1{font-size:clamp(36px,9vw,88px);font-weight:600;letter-spacing:-.05em;line-height:.95;text-align:center}
h1 .dim{color:rgba(255,255,255,.45)}
.box{
  width:min(720px,100%);border-radius:20px;background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:14px;box-shadow:inset 0 0 0 1px var(--line);
}
textarea{
  width:100%;border:0;background:none;resize:none;color:var(--ink);
  font:inherit;font-size:16px;line-height:1.5;outline:0;
  min-height:48px;max-height:160px;
}
textarea::placeholder{color:#80829a}
.row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:10px;color:var(--mute);font-weight:600;font-size:13px;flex-shrink:0}
.chip:hover,.chip.on{background:var(--h);color:var(--ink)}
.send{
  width:38px;height:38px;border-radius:50%;background:#fff;color:#0a0b12;
  display:grid;place-items:center;margin-left:auto;opacity:.35;flex-shrink:0;
}
.send.ready{opacity:1}
.chat{display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden}
.msgs{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:8px 16px 12px;scroll-behavior:smooth;
}
.mi{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-bottom:8px}
.u{
  align-self:flex-end;max-width:min(85%,520px);
  background:rgba(255,255,255,.09);padding:10px 14px;
  border-radius:16px 16px 4px 16px;white-space:pre-wrap;line-height:1.5;
  word-break:break-word;
}
.a{line-height:1.65;color:#dcdce6;white-space:pre-wrap;word-break:break-word}
.a p{margin:0 0 .6em}.a p:last-child{margin:0}
.a code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px}
.think{color:var(--mute)}
.cb{margin:12px 0;border-radius:12px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;color:var(--mute);font-size:12px;border-bottom:1px solid var(--line);gap:8px}
.ch button{padding:4px 9px;border-radius:7px;color:var(--ink);font-weight:600}
.cb pre{padding:12px 14px;overflow:auto;max-height:min(40vh,320px);-webkit-overflow-scrolling:touch}
.cb pre code{background:none;padding:0;color:#c9cadb;font-size:12.5px;line-height:1.55;white-space:pre}
.cin{
  flex-shrink:0;padding:0 16px calc(12px + var(--safe-b));
  display:flex;justify-content:center;
  background:linear-gradient(transparent,rgba(2,2,5,.85) 30%);
}
.pg{
  flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  max-width:820px;width:100%;margin:0 auto;
  padding:12px 18px calc(40px + var(--safe-b));
}
.pg h2{font-size:26px;font-weight:600;margin-bottom:14px}
.in{
  width:100%;height:44px;padding:0 12px;border-radius:11px;border:0;
  background:rgba(255,255,255,.05);color:var(--ink);
  box-shadow:inset 0 0 0 1px var(--line);margin-bottom:12px;font-size:16px;
}
.sc{padding:16px;border-radius:14px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:12px}
.sc h3{font-size:14px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:9px;background:rgba(255,255,255,.08);font-weight:600}
.btn.p{background:#fff;color:#0a0b12}
.fine{margin-top:8px;text-align:center;color:var(--mute);font-size:12px}
.scrim{display:none}
#modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:max(2vh,var(--safe-t)) max(2vw,var(--safe-r)) max(2vh,var(--safe-b)) max(2vw,var(--safe-l))}
#modal.on{display:flex}
.mp{flex:1;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:#0b0b10;box-shadow:inset 0 0 0 1px #2a2a31;min-height:0}
.mh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex-shrink:0}
.mh input{flex:1;min-width:120px;height:36px;padding:0 10px;border-radius:8px;border:0;background:rgba(255,255,255,.06);color:var(--ink);font-size:16px}
#mf{flex:1;border:0;background:#fff;min-height:0}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{
    position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;
    transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    background:rgba(3,3,6,.98);padding-bottom:calc(14px + var(--safe-b));
  }
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;z-index:10;background:#0008}
  .burger{display:grid;width:40px;height:40px;place-items:center;border-radius:10px;color:var(--mute);flex-shrink:0}
  .home h1{font-size:clamp(32px,11vw,64px)}
}
@media(min-width:861px){.burger{display:none}}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><i></i>Arqen Era</div>
    <button class="new" id="newChat">New chat</button>
    <nav class="nav">
      <button data-go="home" class="on">Home</button>
      <button data-go="chats">Chats</button>
      <button data-go="settings">Settings</button>
    </nav>
    <div class="recent" id="rec"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Menu">☰</button>
      <span id="ttl">New chat</span>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="modal"><div class="mp"><div class="mh"><input id="mName" placeholder="Project name"><button class="btn p" id="mSave">Save</button><button class="btn" id="mDl">Download</button><button class="btn" id="mX">Close</button></div><iframe id="mf" title="Preview" sandbox="allow-scripts allow-forms allow-modals"></iframe></div></div>
<script>
(function(){
const $=s=>document.querySelector(s);
let API_BASE=(localStorage.getItem('arqen-api-base')||'https://lightning-console-sierra-audience.trycloudflare.com/v1').replace(/\/$/,'');
const API_KEY='ollama', API_MODEL='arqen';
function ld(){try{const d=JSON.parse(localStorage.getItem('arqen-era-v2'));if(d&&d.chats)return d}catch(e){}return{chats:[],cur:null,use:'ask',style:''}}
let S=ld(); if(!S.use) S.use='ask';
const sv=()=>{try{localStorage.setItem('arqen-era-v2',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let busy=false,ctl=null,codes=[],previewHtml='';
function cur(){return S.chats.find(c=>c.id===S.cur)}
function SYS(){
  if(S.use==='build') return 'You are Arqen Era. Build mode: when the user wants an app or UI, reply with one short sentence then one complete self-contained HTML file (inline CSS/JS, no external libs) in a single html code block. Polished and responsive. '+(S.style||'');
  if(S.use==='plan') return 'You are Arqen Era. Plan mode: outline steps only, no full code. '+(S.style||'');
  return 'You are Arqen Era. Chat normally. Answer questions and talk naturally. Do NOT generate full HTML apps unless the user clearly asks to build or code something. '+(S.style||'');
}
function md(t){
  codes=[]; let o='';
  t.split('```').forEach((s,i)=>{
    if(i%2===0){ if(s.trim()) o+='<p>'+esc(s.trim()).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>')+'</p>'; }
    else {
      const m=s.match(/^([\w+-]*)\n?([\s\S]*)$/), l=m[1]||'code', body=m[2];
      codes.push(body); const n=codes.length-1;
      o+='<div class="cb"><div class="ch"><span>'+esc(l)+'</span><span><button data-copy="'+n+'">Copy</button>'+(/^html?$/i.test(l)?'<button data-prev="'+n+'">Preview</button>':'')+'</span></div><pre><code>'+esc(body)+'</code></pre></div>';
    }
  });
  return o||esc(t);
}
function side(){
  const a=S.chats.slice(0,12);
  $('#rec').innerHTML=a.length?'<div class="grp">Recent</div>'+a.map(c=>`<button data-open="${c.id}">${esc(c.title)}</button>`).join(''):'';
}
function modeChips(){
  return ['ask','plan','build'].map(m=>`<button type="button" class="chip${S.use===m?' on':''}" data-use="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('');
}
function home(){
  $('#ttl').textContent='New chat';
  $('#view').innerHTML=`<div class="home"><h1>Describe it.<br><span class="dim">Watch it ship.</span></h1>
  <div class="box"><textarea id="p" rows="2" placeholder="Say hi, ask a question, or describe an app…" enterkeyhint="send"></textarea>
  <div class="row">${modeChips()}<button type="button" class="send" id="send" aria-label="Send">↑</button></div></div>
  <p class="fine">Ask = chat · Plan = outline · Build = code</p></div>`;
  wire();
}
function chatView(opts){
  const c=cur(); if(!c){home();return}
  const stick=opts&&opts.stick;
  const msEl=$('#ms');
  const nearBottom=!msEl||(msEl.scrollHeight-msEl.scrollTop-msEl.clientHeight<120);
  $('#ttl').textContent=c.title;
  const msgs=c.msgs.map(m=>m.role==='user'?`<div class="u">${esc(m.content)}</div>`:`<div class="a">${m.content?md(m.content):'<span class="think">Thinking…</span>'}</div>`).join('');
  $('#view').innerHTML=`<div class="chat"><div class="msgs" id="ms"><div class="mi">${msgs}</div></div>
  <div class="cin"><div class="box"><textarea id="p" rows="2" placeholder="Reply…" enterkeyhint="send"></textarea>
  <div class="row">${modeChips()}<button type="button" class="send" id="send" aria-label="Send">↑</button></div></div></div></div>`;
  wire();
  const ms=$('#ms');
  if(ms&&(stick||nearBottom||opts&&opts.force)) ms.scrollTop=ms.scrollHeight;
}
function chatsView(){
  $('#ttl').textContent='Chats';
  $('#view').innerHTML=`<div class="pg"><h2>Chats</h2>${S.chats.length?S.chats.map(c=>`<div style="display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0">
    <button type="button" style="flex:1;font-weight:600;text-align:left" data-open="${c.id}">${esc(c.title)}</button>
    <button type="button" class="btn" data-del="${c.id}" aria-label="Delete">×</button></div>`).join(''):'<p style="color:var(--mute)">No chats yet.</p>'}</div>`;
}
function settingsView(){
  $('#ttl').textContent='Settings';
  $('#view').innerHTML=`<div class="pg"><h2>Settings</h2>
  <div class="sc"><h3>Backend API URL</h3>
    <input class="in" id="apiBase" placeholder="https://.../v1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button type="button" class="btn p" id="apiSave">Save</button>
  </div>
  <div class="sc"><h3>Instructions</h3>
    <textarea id="style" style="width:100%;min-height:90px;background:rgba(255,255,255,.05);border:0;border-radius:11px;padding:12px;color:var(--ink);font:inherit;font-size:16px;box-shadow:inset 0 0 0 1px var(--line)" placeholder="Optional custom instructions…"></textarea>
  </div></div>`;
  $('#apiBase').value=API_BASE; $('#style').value=S.style||'';
  $('#apiSave').onclick=()=>{API_BASE=$('#apiBase').value.trim().replace(/\/$/,'');localStorage.setItem('arqen-api-base',API_BASE);alert('Saved')};
  $('#style').oninput=()=>{S.style=$('#style').value;sv()};
}
function wire(){
  const p=$('#p'), s=$('#send'); if(!p) return;
  const sync=()=>{p.style.height='auto';p.style.height=Math.min(p.scrollHeight,160)+'px';s.classList.toggle('ready',!!p.value.trim()||busy)};
  p.oninput=sync; sync();
  const go=()=>{const v=p.value.trim(); if(!v||busy)return; p.value='';sync(); ask(v)};
  p.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}};
  s.onclick=()=>{if(busy&&ctl)ctl.abort(); else go()};
  p.addEventListener('focus',()=>{setTimeout(()=>{const ms=$('#ms'); if(ms) ms.scrollTop=ms.scrollHeight},300)});
}
async function ask(t){
  let c=cur();
  if(!c){c={id:uid(),title:t.slice(0,48),msgs:[],t:Date.now()};S.chats.unshift(c);S.cur=c.id}
  c.msgs.push({role:'user',content:t}); c.t=Date.now(); sv();
  const m={role:'assistant',content:''}; c.msgs.push(m);
  busy=true; ctl=new AbortController(); chatView({force:1}); side();
  const messages=[{role:'system',content:SYS()},...c.msgs.slice(0,-1).map(x=>({role:x.role,content:x.content}))];
  const headers={'Content-Type':'application/json','Authorization':'Bearer '+API_KEY};
  try{
    try{
      const res=await fetch(API_BASE+'/chat/completions',{
        method:'POST', headers, body:JSON.stringify({model:API_MODEL,messages,stream:true}), signal:ctl.signal
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      if(!res.body||!res.body.getReader) throw new Error('no-stream');
      const reader=res.body.getReader(), dec=new TextDecoder(); let buf='';
      let lastPaint=0;
      while(true){
        const {done,value}=await reader.read();
        if(done) break;
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n'); buf=lines.pop()||'';
        let changed=false;
        for(const line of lines){
          const row=line.trim(); if(!row.startsWith('data:')) continue;
          const payload=row.slice(5).trim(); if(payload==='[DONE]') continue;
          try{const j=JSON.parse(payload); const d=j.choices?.[0]?.delta?.content||''; if(d){m.content+=d; changed=true}}catch(e){}
        }
        if(changed){
          const now=performance.now();
          if(now-lastPaint>40){ lastPaint=now; chatView({stick:1}); }
        }
      }
    }catch(streamErr){
      if(streamErr.name==='AbortError') throw streamErr;
      const res=await fetch(API_BASE+'/chat/completions',{
        method:'POST', headers, body:JSON.stringify({model:API_MODEL,messages,stream:false}), signal:ctl.signal
      });
      if(!res.ok){const body=await res.text().catch(()=>''); throw new Error('HTTP '+res.status+(body?': '+body.slice(0,120):''));}
      const j=await res.json();
      m.content=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
    }
    m.content=(m.content||'').replace(/<think>[\s\S]*?<\/think>/gi,'').trim();
  }catch(e){
    if(e.name!=='AbortError'){
      const msg=e&&e.message?e.message:'Network error';
      m.content='Could not reach the model.\n\n'+msg+'\n\nCheck: tunnel online? Settings → API URL correct?';
    }
  }
  busy=false; sv(); chatView({force:1}); side();
}
document.addEventListener('click',e=>{
  const use=e.target.closest('[data-use]');
  if(use){S.use=use.dataset.use;sv(); document.querySelectorAll('[data-use]').forEach(b=>b.classList.toggle('on',b.dataset.use===S.use)); return}
  const cp=e.target.closest('[data-copy]');
  if(cp){navigator.clipboard.writeText(codes[+cp.dataset.copy]||''); cp.textContent='Copied'; setTimeout(()=>cp.textContent='Copy',1000); return}
  const pv=e.target.closest('[data-prev]');
  if(pv){previewHtml=codes[+pv.dataset.prev]||''; $('#modal').classList.add('on'); $('#mf').srcdoc=previewHtml; $('#mName').value=''; return}
  const b=e.target.closest('[data-go],[data-open],[data-del],#newChat,#burger,#scrim,#mX,#mSave,#mDl');
  if(!b) return;
  if(b.id==='newChat'){S.cur=null;sv();home();side();$('#app').classList.remove('open')}
  if(b.id==='burger') $('#app').classList.add('open');
  if(b.id==='scrim') $('#app').classList.remove('open');
  if(b.id==='mX'){$('#modal').classList.remove('on');$('#mf').srcdoc=''}
  if(b.id==='mDl'&&previewHtml){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([previewHtml],{type:'text/html'}));a.download=($('#mName').value||'project')+'.html';a.click()}
  if(b.dataset.go==='home'){S.cur=null;home();side();$('#app').classList.remove('open')}
  if(b.dataset.go==='chats'){chatsView();$('#app').classList.remove('open')}
  if(b.dataset.go==='settings'){settingsView();$('#app').classList.remove('open')}
  if(b.dataset.open){S.cur=b.dataset.open;sv();chatView({force:1});side();$('#app').classList.remove('open')}
  if(b.dataset.del){S.chats=S.chats.filter(c=>c.id!==b.dataset.del); if(S.cur===b.dataset.del)S.cur=null;sv();chatsView();side()}
});
document.addEventListener('touchmove',function(e){
  const sc=e.target.closest('.msgs,.recent,.pg,.home,.cb pre');
  if(!sc) e.preventDefault();
},{passive:false});
home(); side();
})();
</script>
</body>
</html>
