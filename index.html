<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>My AI — Local</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --surface: #161616;
      --surface2: #1f1f1f;
      --border: #2c2c2c;
      --text: #f0f0f0;
      --muted: #8a8a8a;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-top h1 {
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    #status {
      font-size: 0.75rem;
      color: var(--muted);
      max-width: 55%;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    select, .btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      outline: none;
    }
    select { flex: 1; min-width: 0; }
    .btn {
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: #2a2a2a; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-danger { color: var(--danger); border-color: #3f1f1f; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 88%;
      padding: 11px 14px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }
    .user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .system {
      align-self: center;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      max-width: 92%;
      background: transparent;
      border: none;
      padding: 6px 10px;
    }
    .msg-actions {
      position: absolute;
      top: 6px;
      right: 8px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .assistant:hover .msg-actions { opacity: 1; }
    .copy-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 5px;
      cursor: pointer;
    }
    footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      line-height: 1.4;
    }
    #input:focus { border-color: var(--accent); }
    #send {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      height: 44px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    #send:hover { background: var(--accent-hover); }
    #send:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .progress {
      height: 2px;
      background: var(--border);
      width: 100%;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>My AI</h1>
      <div id="status">Loading…</div>
    </div>
    <div class="controls">
      <select id="modelSelect" disabled>
        <option value="SmolLM2-360M-Instruct-q4f16_1-MLC">SmolLM2 360M (fast)</option>
        <option value="SmolLM2-1.7B-Instruct-q4f16_1-MLC">SmolLM2 1.7B (better)</option>
        <option value="Qwen2.5-0.5B-Instruct-q4f16_1-MLC">Qwen2.5 0.5B</option>
        <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B</option>
      </select>
      <button class="btn" id="reloadBtn" disabled title="Reload model">Reload</button>
      <button class="btn btn-danger" id="clearBtn" title="Clear chat">Clear</button>
    </div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  </header>

  <div id="chat"></div>

  <footer>
    <textarea id="input" placeholder="Type a message…" rows="1" disabled></textarea>
    <button id="send" disabled>Send</button>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
