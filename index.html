<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020205">
<title>Arqen Era</title>
</head>
<body style="margin:0;background:#020205;color:#80829a;font-family:system-ui;display:grid;place-items:center;height:100dvh">
<div>Loading Arqen Era…</div>
<script>
(async function () {
  try {
    const n = 3;
    const parts = await Promise.all(
      Array.from({length:n}, (_,i) =>
        fetch('part' + i + '.txt?v=era3').then(r => {
          if (!r.ok) throw new Error('part' + i + ' ' + r.status);
          return r.text();
        })
      )
    );
    const html = parts.join('');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.textContent = 'Failed to load: ' + e.message;
  }
})();
</script>
</body>
</html>
